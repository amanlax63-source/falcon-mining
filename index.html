<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falcon Mining App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(rgba(11, 14, 20, 0.85), rgba(11, 14, 20, 0.95)), 
                        url('falcon_web_app_photo.png') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            text-align: center;
            min-height: 100vh;
        }
        
        /* Top Navigation Header */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .balance-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(51, 65, 85, 0.8);
            border-radius: 12px;
            padding: 8px 16px;
            text-align: left;
        }
        .balance-title {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .balance-value {
            color: #38bdf8;
            font-size: 20px;
            font-weight: bold;
        }
        .profile-btn {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(51, 65, 85, 0.8);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        /* Horizontal Tabs Menu */
        .tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 15px;
        }
        .tab-btn {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(51, 65, 85, 0.8);
            color: #94a3b8;
            padding: 10px 0;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            color: #ffffff;
            background: #0284c7;
            border-color: #38bdf8;
        }

        /* Income Bar */
        .income-bar-container {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(51, 65, 85, 0.8);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .income-value {
            color: #38bdf8;
            font-weight: bold;
        }

        /* Center Tap / Mining Display */
        .mining-display {
            margin: 25px 0;
            padding: 20px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .mining-speed {
            font-size: 14px;
            color: #38bdf8;
            margin-top: 5px;
        }

        /* Horizontal Cards Section */
        .shop-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(5px);
            padding: 12px 6px;
            border-radius: 12px;
            border: 1px solid rgba(51, 65, 85, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .card-bonus {
            color: #38bdf8;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .buy-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 0;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Header -->
    <div class="top-nav">
        <div class="balance-card">
            <div class="balance-title">My Balance</div>
            <div>🦅 <span id="balance" class="balance-value">0.000</span></div>
        </div>
        <button class="profile-btn">Profile</button>
    </div>

    <!-- Horizontal Tabs Menu -->
    <div class="tabs">
        <button class="tab-btn active">Mining</button>
        <button class="tab-btn">Deposit</button>
        <button class="tab-btn">Withdraw</button>
        <button class="tab-btn">Share</button>
    </div>

    <!-- Per Hour Income Bar -->
    <div class="income-bar-container">
        <span>Per Hour income</span>
        <span class="income-value">⚡ <span id="hourly-rate">3600</span> 🦅 / hr</span>
    </div>

    <!-- Center Mining Animation Area -->
    <div class="mining-display">
        <h2 style="font-size: 18px; color: #94a3b8;">Mining Status</h2>
        <div style="font-size: 28px; font-weight: bold; color: #38bdf8; margin: 10px 0;">
            <span id="mined-amount">0.000</span> 🦅
        </div>
        <div class="mining-speed">⛏️ Live Mining Active...</div>
    </div>

    <!-- Shop Cards (Per Hour Rates) -->
    <div class="shop-container">
        <div class="card">
            <div class="card-title">Lv 1</div>
            <div class="card-bonus">+500 / hr</div>
            <button class="buy-btn" onclick="buyMiner(100, 500)">100 🦅</button>
        </div>
        <div class="card">
            <div class="card-title">Lv 2</div>
            <div class="card-bonus">+5,000 / hr</div>
            <button class="buy-btn" onclick="buyMiner(1000, 5000)">1,000 🦅</button>
        </div>
        <div class="card">
            <div class="card-title">Lv 3</div>
            <div class="card-bonus">+25,000 / hr</div>
            <button class="buy-btn" onclick="buyMiner(5000, 25000)">5,000 🦅</button>
        </div>
    </div>

    <script>
        let balance = 100.000; // Starting Balance
        let hourlyRate = 3600; // Per hour mining rate
        let perSecondRate = hourlyRate / 3600; // Mining per second

        // Update Balance and Mining real-time
        setInterval(() => {
            balance += perSecondRate;
            document.getElementById('balance').innerText = balance.toFixed(3);
            document.getElementById('mined-amount').innerText = balance.toFixed(3);
        }, 1000);

        // Buy Miner Function
        function buyMiner(cost, addRate) {
            if (balance >= cost) {
                balance -= cost;
                hourlyRate += addRate;
                perSecondRate = hourlyRate / 3600;
                document.getElementById('hourly-rate').innerText = hourlyRate.toLocaleString();
                document.getElementById('balance').innerText = balance.toFixed(3);
            } else {
                alert("ተጨማሪ ኮይን ያስፈልግዎታል!");
            }
        }
    </script>
</body>
</html>
