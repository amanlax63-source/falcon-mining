<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falcon Mining App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }
        .balance-box {
            font-size: 28px;
            font-weight: bold;
            color: #38bdf8;
        }
        .falcon-logo {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid #38bdf8;
            box-shadow: 0 0 25px #0284c7;
            margin: 20px auto;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .falcon-logo:active {
            transform: scale(0.95);
        }
        .shop-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .card {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>Total Balance</div>
        <div class="balance-box"><span id="balance">1000</span> $FALCON</div>
    </div>

    <div onclick="tapFalcon()">
        <img src="falcon_web_app_photo.png" class="falcon-logo" alt="Falcon Mining">
    </div>
    <p>Tap falcon to mine coins!</p>

    <h2>🛒 Auto-Miner Shop</h2>
    <div class="shop-container">
        <div class="card">
            <h3>Miner Lv 1</h3>
            <p>Cost: 10 $FALCON</p>
            <p>Speed: 2.5 / day</p>
            <button class="btn" onclick="buyMiner(10)">Buy Miner</button>
        </div>
        <div class="card">
            <h3>Miner Lv 2</h3>
            <p>Cost: 50 $FALCON</p>
            <p>Speed: 12.5 / day</p>
            <button class="btn" onclick="buyMiner(50)">Buy Miner</button>
        </div>
        <div class="card">
            <h3>Miner Lv 3</h3>
            <p>Cost: 250 $FALCON</p>
            <p>Speed: 62.5 / day</p>
            <button class="btn" onclick="buyMiner(250)">Buy Miner</button>
        </div>
        <div class="card">
            <h3>Miner Lv 4</h3>
            <p>Cost: 1,000 $FALCON</p>
            <p>Speed: 250 / day</p>
            <button class="btn" onclick="buyMiner(1000)">Buy Miner</button>
        </div>
    </div>

    <script>
        let balance = 1000;

        function tapFalcon() {
            balance += 1;
            document.getElementById('balance').innerText = balance;
        }

        function buyMiner(cost) {
            // ምንም ዓይነት Alert ሳይመጣ በቀጥታ ባላንስ ይቀንሳል
            if (balance >= cost) {
                balance -= cost;
                document.getElementById('balance').innerText = balance;
            }
        }
    </script>
</body>
</html>
